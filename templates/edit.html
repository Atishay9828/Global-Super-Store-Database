<!DOCTYPE html>
<html>
<head>
    <title>Edit {{ table }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4" style="background: black;" >
    <h2 class="mb-4" style="color: white;">Edit {{ table }}</h2>
    <form method="POST">
      {% for key, value in row.items() %}
        {% if key != 'CustomerID' %}
        <div class="mb-3">
            <label class="form-label" style="color: white;">{{ key }}</label>
            {% if key == 'Segment' %}
            <select class="form-select" name="Segment">
              <option value="Consumer" {% if value == "Consumer" %}selected{% endif %}>Consumer</option>
              <option value="Corporate" {% if value == "Corporate" %}selected{% endif %}>Corporate</option>
              <option value="Home Office" {% if value == "Home Office" %}selected{% endif %}>Home Office</option>
            </select>
            {% else %}
            <input class="form-control" name="{{ key }}" value="{{ value }}">
            {% endif %}
        </div>
        {% endif %}
      {% endfor %}
      <button type="submit" class="btn btn-success">Update</button>
      <a href="/customers" class="btn btn-secondary ms-2">Cancel</a>
    </form>
</body>
</html>

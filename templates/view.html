<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body {
          background-color: #121212;
          color: #f1f1f1;
      }
      a, th, td, h1, h2, h3, p, label {
          color: #f1f1f1 !important;
      }
      .btn {
          cursor: pointer !important;
      }
      .table {
          background-color: #000 !important;
          color: #f1f1f1;
      }
      .table th, .table td {
          background-color: #1a1a1a !important;
          border-color: #444;
      }
      .thead-dark th {
          background-color: #222 !important;
          color: #fff !important;
      }
      .form-control {
          background-color: #2b2b2b;
          color: #f1f1f1;
          border: 1px solid #444;
      }
  </style>
  
  </head>
<body class="container py-4" style="background: black;">
  <div class="container mt-3">
    <div class="d-flex justify-content-between mb-3">
      <a href="/" class="btn btn-secondary">⬅ Back to Home</a>
  </div>
  
</div>

    <h2 class="mb-4">{{ title }}</h2>
    <table class="table table-bordered table-striped" style="background: gray;">
      <thead class="table-dark" style="background: gray;">
        <tr>
          {% for key in data[0].keys() %}
            <th>{{ key }}</th>
          {% endfor %}
          <th>Edit</th>
        </tr>
      </thead>
      <tbody>
        {% for row in data %}
        <tr>
          {% for item in row.values() %}
          <td>{{ item }}</td>
          {% endfor %}
          <td><a class="btn btn-sm btn-primary" href="/edit/{{ title.lower() }}/{{ row['CustomerID'] }}">Edit</a></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <a href="/" class="btn btn-secondary mt-3">Back</a>
</body>
</html>
